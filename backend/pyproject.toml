[project]
name = "formsight-backend"
version = "0.1.0"
description = "Private Qwen + YOLO questionnaire scanner"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py"]
